<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BROKEN LORD Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { background:#050011; color:white; font-family:Arial, sans-serif; padding:20px; }
    h2 { margin-bottom:10px; }
    .top-links { margin-bottom:15px; font-size:13px; }
    .top-links a { color:#7fe3ff; text-decoration:none; }
    .site-box {
      background:#120028;
      padding:15px;
      border-radius:10px;
      margin-bottom:12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      box-shadow:0 0 15px rgba(140,0,255,0.4);
    }
    .site-box a { color:#7fe3ff; text-decoration:none; font-size:13px; }
    img.delete {
      width:45px;
      height:45px;
      cursor:pointer;
      border-radius:10px;
      box-shadow:0 0 15px rgba(255,0,80,0.7);
    }
  </style>
</head>
<body>

<div class="top-links">
  <a href="/index.html">← Back to Create Page</a>
</div>

<h2>📁 BROKEN LORD Hosted Websites</h2>
<div id="list">Loading...</div>

<script>
async function loadSites() {
  const res = await fetch("/list");
  const data = await res.json();

  const box = document.getElementById("list");
  box.innerHTML = "";

  if (!data.sites || data.sites.length === 0) {
    box.textContent = "Bado hakuna site iliyo hostiwa.";
    return;
  }

  data.sites.forEach(site => {
    const div = document.createElement("div");
    div.className = "site-box";

    div.innerHTML = `
      <div>
        <b>${site}</b><br>
        <a href="/sites/${site}/" target="_blank">Open Website</a>
      </div>
      <img src="/delete.png" class="delete" alt="Delete" onclick="deleteSite('${site}')">
    `;

    box.appendChild(div);
  });
}

async function deleteSite(name) {
  if (!confirm("Una uhakika unataka kufuta site: " + name + " ?")) return;

  await fetch("/delete?name=" + encodeURIComponent(name));
  loadSites();
}

loadSites();
</script>

</body>
</html>
